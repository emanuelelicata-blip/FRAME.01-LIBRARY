let syncT, syncN = 0;
function syncBadge(ritarda){
  const el = $('#sync'); if (!el) return;
  if (window.__ONLINE) { const m = C.meta; el.textContent = ' · build ' + (m.build || '—') + (m.pubblicato ? ' · pubblicata il ' + new Date(m.pubblicato).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }) : ''); return; }

  }, ritarda ? (typeof ritarda === 'number' ? ritarda : 1500) : 0);

let pubblicando = false;

  if (pubblicando) return; pubblicando = true;
