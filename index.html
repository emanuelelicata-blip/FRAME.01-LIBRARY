.pg{flex:none;font:400 12.5px/16px var(--mono);color:var(--mfg);background:none;border:1px solid var(--glass-border);border-radius:999px;padding:8px 14px;min-height:36px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.pg .n{opacity:.55;font-size:11px}.pg:hover{color:var(--fg);border-color:var(--fg)}
.pg.on{background:var(--pill-active);color:var(--pill-active-fg);border-color:var(--pill-active)}
.phead{padding:16px 24px 0;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.phead h1,.hhead h1{margin:0;font:600 28px/1.1 var(--sans);letter-spacing:-.025em}
.phead p,.hhead p{margin:6px 0 0;color:var(--muted);max-width:660px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.home{padding:20px 12px 120px}.hhead{padding:0 12px 14px}
.hstat{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 18px;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-card);box-shadow:inset 1px 1px 0 var(--glass-hi)}
.hsec{margin:22px 12px 10px;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--widget-gap,12px)}
.acard{text-align:left;display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;min-height:150px;cursor:pointer;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-card);box-shadow:inset 1px 1px 0 var(--glass-hi),var(--shadow-card);color:var(--fg)}
.acard:hover{border-color:var(--fg)}.acard b{font:600 17px/1.2 var(--sans);letter-spacing:-.01em}.acard .d{color:var(--muted);font-size:12.5px;line-height:1.4;flex:1}.acard.zero{opacity:.55}
.acard .tags{margin-top:4px}
.chip.tool{background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg)}
.favbtn{border:1px solid var(--line);background:transparent;border-radius:999px;min-width:30px;height:24px;cursor:pointer;line-height:1;font-size:14px;padding:0 6px}
.favbtn.on{color:#d99a00;border-color:currentColor}
.cfb{display:flex;gap:6px;align-items:center;flex:none;overflow:visible!important}
.ph.pr{place-items:start;padding:14px;background:color-mix(in srgb,var(--tc,#f08c00) 10%,var(--chip))}
.ph.pr span{display:block;font:400 11.5px/1.45 var(--mono);color:var(--muted);overflow:hidden;max-height:100%}
.t-prompt{--tc:#f08c00}.t-componente{--tc:#12b886}.t-riferimento{--tc:#fd7e14}
.kitrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:760px){.pages{padding:12px 10px 2px;margin:0}.phead{padding:14px 16px 0}.phead h1,.hhead h1{font-size:22px}.home{padding:16px 8px 120px}.agrid{grid-template-columns:1fr 1fr}.acard{min-height:128px;padding:14px}.acard .d{display:none}}
</style>
<style id="v6">
html{scroll-padding-top:130px}
body{-webkit-tap-highlight-color:transparent}
button,a,.card,.acard,.pg{touch-action:manipulation}
.top{padding-top:env(safe-area-inset-top)}
.pages{position:sticky;top:calc(66px + env(safe-area-inset-top));z-index:25;margin:0;padding:10px 18px 8px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1)}
.crumb{font:400 12px var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb button{border:0;background:none;padding:0;cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:3px}
.phead .crumb{width:100%;margin-bottom:-6px}
.dnav{display:flex;gap:6px;align-items:center;margin-top:10px}
.dnav button{min-width:40px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px}
.dnav .mini{margin:0 4px}
.dtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#toTop{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:34;width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-strong);color:var(--fg);cursor:pointer;display:none;place-items:center;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
#toTop.show{display:grid}
@media(min-width:761px){#toTop{bottom:24px}}
.pv.fs{position:fixed;inset:0;z-index:80;height:100%;border-radius:0}
.pvx{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:81}
.pv.fs~.pvx,.pvx.on{display:block}
.shot{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--chip)}
.shot img{display:block;width:100%;height:auto;min-height:200px;object-fit:cover}
.opts label{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
@media(pointer:coarse){input,select,textarea{font-size:16px!important}.dnav button{height:44px;min-width:48px}.pg{min-height:44px}.kitbtn,.favbtn{min-height:34px}}
@media(max-width:760px){.pages{top:calc(58px + env(safe-area-inset-top));padding:8px 10px 6px}.drawer{width:100vw}.dh{padding-top:calc(18px + env(safe-area-inset-top))}.close{top:calc(14px + env(safe-area-inset-top))}}
@media(display-mode:standalone){.banner{display:none}}
</style>

  if (S.area) a.push(['area', (PSHORT[S.area] || S.area)]); if (S.strum) a.push(['strum', STR[S.strum] || S.strum]); if (S.favOnly) a.push(['fav', '★ Preferiti']);
  if (S.fonte) a.push(['fonte', S.fonte]); if (S.tipo) a.push(['tipo', tl(S.tipo)]);
  S.tag.forEach(t => a.push(['tag:' + t, TAGL[t] || t]));
  if (S.stato) a.push(['stato', 'Stato: ' + (S.stato === '*' ? 'tutti' : S.stato === '-' ? 'senza stato' : S.stato)]);
  if (S.prev) a.push(['prev', 'Con anteprima']); if (S.dup) a.push(['dup', 'Con copie']);
  return a;
}
function renderActive(){
  const a = activeList();
  $('#active').innerHTML = a.map(([k, l]) => `<button class="chip on" data-clear="${esc(k)}" aria-label="Togli filtro ${esc(l)}">${esc(l)} <span aria-hidden="true">✕</span></button>`).join('');
  $('#fN').textContent = a.length; $('#tbFN').textContent = a.length;
  $('#sArea').textContent = S.area ? (PSHORT[S.area] || S.area) : 'Tutte'; $('#sStrum').textContent = S.strum ? (STR[S.strum] || S.strum) : 'Tutti';
  $('#sFonte').textContent = S.fonte || 'Tutte'; $('#sTipo').textContent = S.tipo ? tl(S.tipo) : 'Tutti'; $('#sTag').textContent = S.tag.size ? S.tag.size + ' selezionati' : 'Nessuno';
  const o = [S.stato, S.prev, S.dup, S.favOnly].filter(Boolean).length; $('#sOpz').textContent = o ? o + ' attive' : 'Predefinite';
}
function applyView(){
  const g = $('#grid'), z = S.z[S.view]; let dense = false;
  g.className = 'grid v-' + S.view;
  if (S.view === 'var') { const cw = Math.round(170 + z * 3.2); g.style.setProperty('--cw', cw + 'px'); dense = cw < 215; }
  else if (S.view === 'fix') { const want = Math.round(8 - z * 0.07), max = Math.max(1, Math.floor((g.clientWidth || innerWidth) / 120)); const cols = Math.min(want, max); g.style.setProperty('--cols', cols); dense = cols >= 6; }
  else g.style.setProperty('--lt', Math.round(72 + z * 1.8) + 'px');
  if (dense && S.view !== 'list') g.classList.add('dense');
  $('#zoom').value = z;
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === S.view));
}
function zoomBy(d){ S.z[S.view] = Math.max(0, Math.min(100, S.z[S.view] + d)); store.set('z', S.z); applyView(); }
function setPanel(open){ $('#fpanel').hidden = !open; $('#bFiltri').setAttribute('aria-expanded', open); $('#tbFiltri').classList.toggle('on', open); }
document.querySelectorAll('.acc').forEach(a => { if (S.acc.has(a.dataset.acc)) { a.classList.add('open'); a.querySelector('.acc-h').setAttribute('aria-expanded', 'true'); } });
document.addEventListener('click', e => {
  const t = e.target;
  const ah = t.closest('.acc-h'); if (ah) { const a = ah.parentElement, k = a.dataset.acc; a.classList.toggle('open'); const o = a.classList.contains('open'); ah.setAttribute('aria-expanded', o); o ? S.acc.add(k) : S.acc.delete(k); store.set('acc', [...S.acc]); return; }
  if (t.closest('#bFiltri')) { setPanel($('#fpanel').hidden); return; }
  if (t.closest('#bChiudiF')) { setPanel(false); return; }
  const cl = t.closest('[data-clear]'); if (cl) { const k = cl.dataset.clear;
    if (k === 'q') { S.q = ''; $('#q').value = ''; } else if (k === 'area') S.area = ''; else if (k === 'strum') S.strum = ''; else if (k === 'fav') { S.favOnly = false; $('#fFav').checked = false; } else if (k === 'fonte') S.fonte = ''; else if (k === 'tipo') S.tipo = '';
    else if (k.startsWith('tag:')) { S.tag.delete(k.slice(4)); renderTags(); } else if (k === 'stato') { S.stato = ''; $('#fStato').value = ''; }
    else if (k === 'prev') { S.prev = false; $('#fPrev').checked = false; } else if (k === 'dup') { S.dup = false; $('#fDup').checked = false; }
    S.limit = 96; render(); return; }
  const vw = t.closest('[data-view]'); if (vw) { S.view = vw.dataset.view; store.set('view', S.view); applyView(); return; }
  if (t.closest('#zIn')) { zoomBy(10); return; } if (t.closest('#zOut')) { zoomBy(-10); return; }
  const go = t.closest('[data-go]'); if (go) { const k = go.dataset.go;
    if (k === 'home') { if (S.page === 'home') scrollTo({ top: 0, behavior: 'smooth' }); else setPage('home'); }
    else if (k === 'filtri') { const open = $('#fpanel').hidden; setPanel(open); if (open) $('#fpanel').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (k === 'kit') $('#bKit').click(); else if (k === 'menu') $('#dlgMenu').showModal();
    else if (k[0] === '#') { $('#dlgMenu').close(); const el = $(k); if (!el) return; if (el.tagName === 'A') location.href = el.href; else el.click(); } }
});
document.addEventListener('input', e => { if (e.target.id === 'zoom') { S.z[S.view] = +e.target.value; store.set('z', S.z); applyView(); } });
document.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey) return; if (e.key === '+' || e.key === '=') zoomBy(10); else if (e.key === '-') zoomBy(-10); });
$('#main').addEventListener('wheel', e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); zoomBy(e.deltaY < 0 ? 4 : -4); }, { passive: false });
window.addEventListener('resize', applyView);

/* ---------- v3: pagine, area, strumento, kit di pagina, aggiorna ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const pg = t.closest('[data-page]'); if (pg) { setPage(pg.dataset.page); return; }
  const mp = t.closest('[data-menupage]'); if (mp) { $('#dlgMenu').close(); setPage(mp.dataset.menupage); return; }
  const sp = t.closest('[data-strumpage]'); if (sp) { S.strum = ''; setPage('tutto'); S.strum = sp.dataset.strumpage; render(); return; }
  const ar = t.closest('[data-area]'); if (ar) { S.area = ar.dataset.area; S.limit = 96; render(); return; }
  const sr = t.closest('[data-strum]'); if (sr) { S.strum = sr.dataset.strum; S.limit = 96; render(); return; }
  if (t.closest('[data-kitpage]')) { const l = list().slice(0, 200); l.forEach(i => S.kit.add(i.id)); store.set('kit', [...S.kit]); render(); toast(l.length + ' elementi nel kit'); return; }
  if (t.closest('[data-kitclear]')) { S.kit.clear(); store.set('kit', []); render(); kitRender(); return; }
  if (t.closest('#bScan2')) { scan(); return; }
});

/* ---------- v6: navigazione, anteprime, cartella locale, iPhone/iPad ---------- */
function navItem(d){ if (!cur || !cur.seq) return; const k = cur.seq.indexOf(cur.id) + d; if (k < 0 || k >= cur.seq.length) return; const t = cur.tab; openItem(cur.seq[k], t); const p = $('#panel'); if (p) p.scrollTop = 0; }
document.addEventListener('click', e => {
  const t = e.target;
  const nv = t.closest('[data-nav]'); if (nv && !nv.disabled) { navItem(+nv.dataset.nav); return; }
  if (t.closest('[data-closeitem]')) { closeItem(); return; }
  if (t.closest('[data-share]') && cur) { const i = byId[cur.id]; navigator.share({ title: i.titolo, text: i.testo || i.descrizione || '', url: i.link || undefined }).catch(() => {}); return; }
  const fs = t.closest('[data-fs]'); if (fs) { const on = fs.dataset.fs === '1', pv = $('#pv'); if (pv) { pv.classList.toggle('fs', on); document.querySelector('.pvx').classList.toggle('on', on); fitPv(); } return; }
  if (t.closest('#toTop')) { scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.closest('#dirLink')) { dirLink(); return; }
  if (t.closest('#dirAsk')) { dirPerm(true).then(ok => { toast(ok ? 'Cartella riautorizzata' : 'Permesso non concesso'); pvCache.clear(); fontiRender(); }); return; }
  if (t.closest('#dirOff')) { idb('readwrite', s => s.delete('inbox')).then(() => { DIR = null; pvCache.clear(); fontiRender(); toast('Cartella scollegata'); }); return; }
});
async function dirLink(){ try { const h = await window.showDirectoryPicker({ id: 'f01-inbox', mode: 'read' }); await idb('readwrite', s => s.put(h, 'inbox')); DIR = h; pvCache.clear(); toast('Cartella collegata: ' + h.name); fontiRender(); render(); } catch (e) { if (e && e.name !== 'AbortError') toast('Non riesco ad aprire la cartella'); } }
document.addEventListener('change', e => { if (e.target.id === 'optShots') { S.shots = e.target.checked; store.set('shots', S.shots); render(); if (cur) drawRender(); } });
document.addEventListener('keydown', e => { if (!cur || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey || e.altKey) return; if (e.key === 'ArrowRight') navItem(1); else if (e.key === 'ArrowLeft') navItem(-1); });
{ let x0 = 0, y0 = 0, ok = false; const dr = $('#drawer');
  dr.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; ok = x0 > 28 && !e.target.closest('.pv, pre, table, .tabs, .dev, textarea, input, select'); }, { passive: true });
  dr.addEventListener('touchend', e => { if (!ok) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; if (Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 2) navItem(dx < 0 ? 1 : -1); }, { passive: true }); }
document.body.insertAdjacentHTML('beforeend', '<button id="toTop" aria-label="Torna su" title="Torna su"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>');
addEventListener('scroll', () => $('#toTop').classList.toggle('show', scrollY > 700), { passive: true });
// suggerimento «Aggiungi a Home» su iPhone/iPad (solo online, solo la prima volta)
if (window.__ONLINE && /iPhone|iPad|iPod/.test(navigator.userAgent) || (window.__ONLINE && navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent))) {
  if (!navigator.standalone && !store.get('a2hs', false)) { const b = $('#fileBanner'); b.hidden = false; b.innerHTML = '<b>Usala come app:</b> tocca <b>Condividi</b> → <b>Aggiungi a Home</b>. <button class="link" id="a2x">Ho capito</button>'; b.addEventListener('click', e => { if (e.target.id === 'a2x') { store.set('a2hs', true); b.hidden = true; } }); }
}

/* ---------- avvio ---------- */
const th = store.get('theme', null); if (th) document.documentElement.dataset.theme = th;
$('#meta').textContent = `${C.meta.totale} elementi · ${C.meta.fonti} ${C.meta.fonti === 1 ? 'fonte' : 'fonti'}`;
{ const h0 = decodeURIComponent(location.hash.slice(1)); if (h0.startsWith('/') && validPage(h0.slice(1))) S.page = h0.slice(1); else if (h0 && byId[h0]) S.page = ARE[byId[h0].area] ? byId[h0].area : 'tutto'; }
renderTags(); render();
if (HTTP) { api('stato').then(r => { if (r && r.ok) {
  SRV = r; $('#bScan').hidden = false;
  const srv = new Set(Object.entries(r.annotazioni || {}).filter(([, a]) => a && a.preferito).map(([id]) => id).filter(id => byId[id]));
  S.fav.forEach(id => { if (!srv.has(id)) api('annota', { id, patch: { preferito: true } }); });
  srv.forEach(id => S.fav.add(id)); store.set('fav', [...S.fav]);
  updScan(); render(); if (cur) drawRender(); } }); }

})();
